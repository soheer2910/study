<!-- ... existing code ... -->
        <!-- Add/Edit Task Modal -->
    <div id="task-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-3xl p-6 sm:p-8 max-w-xl w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100 dark:border-slate-800">
                <h3 id="modal-title" class="text-lg font-bold">إضافة مهمة دراسية جديدة</h3>
                <button onclick="closeTaskModal()" class="w-9 h-9 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="task-form" onsubmit="saveTask(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">عنوان المهمة / الواجب / الاختبار</label>
                    <input type="text" id="task-title" required placeholder="مثال: تسليم مشروع مادة الخوارزميات" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">المساق الدراسي</label>
                        <input type="text" id="task-subject" required placeholder="مثال: هندسة برمجيات" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">مستوى الأهمية</label>
                        <select id="task-priority" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all">
                            <option value="normal">عادية</option>
                            <option value="important">مهمة</option>
                            <option value="urgent">عالية الأهمية (عاجلة)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">تاريخ ووقت البدء (ميلادي)</label>
                        <input type="datetime-local" id="task-start" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">تاريخ ووقت النهاية - الموعد النهائي (ميلادي)</label>
                        <input type="datetime-local" id="task-end" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">ملاحظات أو تفاصيل إضافية</label>
                    <textarea id="task-notes" rows="2" placeholder="أضف تفاصيل المادة، المراجع المطلوبة، أو خطوات التنفيذ..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl py-3 px-4 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all resize-none"></textarea>
                </div>

                <!-- File Attachment Input -->
                <div>
                    <label class="block text-xs font-bold mb-2 text-slate-600 dark:text-slate-400">إرفاق ملف أو مستند (اختياري)</label>
                    <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-2">
                        <label class="cursor-pointer bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 text-xs font-bold py-2 px-4 rounded-xl transition-all flex items-center gap-2 shrink-0">
                            <i class="fa-solid fa-paperclip"></i>
                            <span>اختر ملفاً</span>
                            <input type="file" id="task-file-input" onchange="handleFileSelect(event)" class="hidden">
                        </label>
                        <span id="file-name-display" class="text-xs text-slate-500 dark:text-slate-400 truncate">لم يتم اختيار ملف</span>
                        <button type="button" id="remove-file-btn" onclick="removeAttachedFile()" class="hidden text-rose-500 hover:text-rose-700 text-xs px-2"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeTaskModal()" class="px-5 py-3 rounded-2xl font-bold text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">إلغاء</button>
                    <button type="submit" class="px-6 py-3 rounded-2xl font-bold text-xs bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/25 transition-all">حفظ المهمة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('uni_tasks')) || [
            {
                id: '1',
                title: 'تسليم مشروع نظم التشغيل',
                subject: 'نظم تشغيل متقدمة',
                priority: 'urgent',
                start: '2026-06-01T08:00',
                end: '2026-06-08T23:59',
                notes: 'إعداد تقرير المشروع البرمجي ورفع الملفات على منصة الجامعة.',
                completed: false,
                fileName: null,
                fileData: null
            },
            {
                id: '2',
                title: 'مراجعة محاضرة الشبكات',
                subject: 'شبكات الحاسوب',
                priority: 'important',
                start: '2026-06-05T10:00',
                end: '2026-06-06T12:00',
                notes: 'التركيز على طبقات OSI والبروتوكولات TCP/IP.',
                completed: true,
                fileName: null,
                fileData: null
            }
        ];

        let currentFilter = 'all';
        let tempAttachedFile = { name: null, data: null };

        const startupQuotes = [
            {
                title: "طاقة إيجابية لتبدأ يومك الجامعي!",
                text: "تنظيم وقتك الجامعي اليوم يعني استثماراً حقيقياً في مستقبلك المهني. لا تؤجل عمل اليوم إلى الغد!"
            },
            {
                title: "سر النجاح الأكاديمي!",
                text: "النجاح ليس صدفة، بل هو ثمرة التخطيط المستمر، والمتابعة الدقيقة، والتغلب على التسويف."
            },
            {
                title: "إضاءة إدارية لليوم!",
                text: "قسم مهامك الكبيرة إلى أجزاء صغيرة يسهل إنجازها، واجعل لكل دقيقة وزناً في جدولك الدراسي."
            },
            {
                title: "همة حتى القمة!",
                text: "كل خطوة تخطوها اليوم في دراستك تقربك خطوة إضافية نحو حلمك. استعن بالله وابدأ!"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            initStartupQuote();
            renderTasks();
            updateStats();
            checkReminders();
            setInterval(checkReminders, 60000);
        });

        function initStartupQuote() {
            const randomQuote = startupQuotes[Math.floor(Math.random() * startupQuotes.length)];
            const quoteTitleEl = document.getElementById('startup-quote-title');
            const quoteTextEl = document.getElementById('startup-quote-text');
            if (quoteTitleEl) quoteTitleEl.innerText = randomQuote.title;
            if (quoteTextEl) quoteTextEl.innerText = `"${randomQuote.text}"`;
        }

        function closeStartupModal() {
            const modal = document.getElementById('startup-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('uni_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('uni_theme', 'dark');
            }
        }

        if (localStorage.getItem('uni_theme') === 'dark' || (!localStorage.getItem('uni_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempAttachedFile = {
                        name: file.name,
                        data: e.target.result
                    };
                    document.getElementById('file-name-display').innerText = file.name;
                    document.getElementById('remove-file-btn').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeAttachedFile() {
            tempAttachedFile = { name: null, data: null };
            document.getElementById('task-file-input').value = '';
            document.getElementById('file-name-display').innerText = 'لم يتم اختيار ملف';
            document.getElementById('remove-file-btn').classList.add('hidden');
        }

        function openTaskModal(taskId = null) {
            const modal = document.getElementById('task-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            
            tempAttachedFile = { name: null, data: null };
            document.getElementById('task-file-input').value = '';
            document.getElementById('file-name-display').innerText = 'لم يتم اختيار ملف';
            document.getElementById('remove-file-btn').classList.add('hidden');

            if (taskId) {
                document.getElementById('modal-title').innerText = 'تعديل المهمة الدراسية';
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('task-title').value = task.title;
                    document.getElementById('task-subject').value = task.subject;
                    document.getElementById('task-priority').value = task.priority;
                    document.getElementById('task-start').value = task.start;
                    document.getElementById('task-end').value = task.end;
                    document.getElementById('task-notes').value = task.notes || '';
                    if (task.fileName) {
                        tempAttachedFile = { name: task.fileName, data: task.fileData };
                        document.getElementById('file-name-display').innerText = task.fileName;
                        document.getElementById('remove-file-btn').classList.remove('hidden');
                    }
                }
            } else {
                document.getElementById('modal-title').innerText = 'إضافة مهمة دراسية جديدة';
                document.getElementById('task-form').reset();
                document.getElementById('task-id').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('task-start').value = now.toISOString().slice(0,16);
            }
        }

        function closeTaskModal() {
            const modal = document.getElementById('task-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value;
            const subject = document.getElementById('task-subject').value;
            const priority = document.getElementById('task-priority').value;
            const start = document.getElementById('task-start').value;
            const end = document.getElementById('task-end').value;
            const notes = document.getElementById('task-notes').value;

            if (new Date(end) <= new Date(start)) {
                showToast('تاريخ النهاية يجب أن يكون بعد تاريخ البدء!', 'error');
                return;
            }

            if (id) {
                tasks = tasks.map(t => t.id === id ? { 
                    ...t, 
                    title, 
                    subject, 
                    priority, 
                    start, 
                    end, 
                    notes, 
                    fileName: tempAttachedFile.name || t.fileName, 
                    fileData: tempAttachedFile.data || t.fileData 
                } : t);
                showToast('تم تحديث المهمة بنجاح');
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    subject,
                    priority,
                    start,
                    end,
                    notes,
                    completed: false,
                    fileName: tempAttachedFile.name,
                    fileData: tempAttachedFile.data
                };
                tasks.push(newTask);
                showToast('تمت إضافة المهمة بنجاح');
            }

            saveAndRefresh();
            closeTaskModal();
        }

        function deleteTask(id) {
            if (confirm('هل أنت متأكد من حذف هذه المهمة الدراسية؟')) {
                tasks = tasks.filter(t => t.id !== id);
                showToast('تم حذف المهمة بنجاح');
                saveAndRefresh();
            }
        }

        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    showCompletionMotivation();
                }
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('uni_tasks', JSON.stringify(tasks));
            renderTasks();
            updateStats();
        }

        function resetData() {
            if (confirm('هل تريد فعلاً إعادة ضبط جميع البيانات والمهام؟')) {
                localStorage.removeItem('uni_tasks');
                tasks = [];
                saveAndRefresh();
                showToast('تمت إعادة ضبط البيانات بنجاح');
            }
        }

        const completionMotivations = [
            "رائع جداً! خطوة ممتازة نحو التفوق الجامعي 🌟",
            "عاش! إنجاز عظيم يقرّبك من مرتبة الشرف 🎓",
            "أنت بطل! تم إنجاز المهمة بكفاءة عالية 💪",
            "استمر بهذا الأداء المذهل، مستقبلك مشرق ✨",
            "إنجاز يضاف إلى سجلك الأكاديمي المتميز 🚀"
        ];

        function showCompletionMotivation() {
            const msg = completionMotivations[Math.floor(Math.random() * completionMotivations.length)];
            showToast(msg, 'success');
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'pending', 'completed', 'urgent'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-5 py-2.5 rounded-2xl font-bold text-xs transition-all bg-indigo-600 text-white shadow-md shadow-indigo-500/20 whitespace-nowrap';
                } else {
                    btn.className = 'px-5 py-2.5 rounded-2xl font-bold text-xs transition-all bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 whitespace-nowrap';
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const emptyState = document.getElementById('empty-state');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            let filtered = tasks.filter(t => {
                const matchesSearch = t.title.toLowerCase().includes(searchQuery) || t.subject.toLowerCase().includes(searchQuery);
                if (!matchesSearch) return false;

                if (currentFilter === 'pending') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                if (currentFilter === 'urgent') return t.priority === 'urgent' && !t.completed;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(a.end) - new Date(b.end);
            });

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.style.display = 'flex';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            const now = new Date();

            filtered.forEach(task => {
                const endDate = new Date(task.end);
                const startDate = new Date(task.start);
                const isOverdue = !task.completed && endDate < now;
                const timeRemaining = formatTimeRemaining(endDate, now, task.completed);

                let priorityBadge = '';
                if (task.priority === 'urgent') {
                    priorityBadge = '<span class="px-2.5 py-1 bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 text-[10px] font-bold rounded-full">عاجلة</span>';
                } else if (task.priority === 'important') {
                    priorityBadge = '<span class="px-2.5 py-1 bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 text-[10px] font-bold rounded-full">مهمة</span>';
                } else {
                    priorityBadge = '<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-[10px] font-bold rounded-full">عادية</span>';
                }

                let fileBadge = '';
                if (task.fileName && task.fileData) {
                    fileBadge = `<a href="${task.fileData}" download="${task.fileName}" class="inline-flex items-center gap-1.5 px-3 py-1 bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 text-[11px] font-bold rounded-xl transition-all" title="تحميل الملف المرفق">
                        <i class="fa-solid fa-paperclip"></i>
                        <span class="max-w-[120px] truncate">${escapeHtml(task.fileName)}</span>
                        <i class="fa-solid fa-download text-[9px]"></i>
                    </a>`;
                }

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-slate-900 border rounded-3xl p-6 shadow-sm flex flex-col justify-between transition-all hover:shadow-md relative overflow-hidden ${task.completed ? 'opacity-75 border-emerald-500/30 bg-emerald-50/10' : isOverdue ? 'border-rose-500/50' : 'border-slate-100 dark:border-slate-800'}`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="px-3 py-1 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 text-xs font-bold rounded-xl">${escapeHtml(task.subject)}</span>
                                ${priorityBadge}
                            </div>
                            <button onclick="toggleComplete('${task.id}')" class="w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all shrink-0 ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-700 hover:border-indigo-500'}">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>
                        </div>

                        <h4 class="text-base font-bold mb-2 ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(task.title)}</h4>
                        
                        ${task.notes ? `<p class="text-xs text-slate-500 dark:text-slate-400 mb-3 line-clamp-2">${escapeHtml(task.notes)}</p>` : ''}
                        
                        ${fileBadge ? `<div class="mb-4">${fileBadge}</div>` : '<div class="mb-2"></div>'}
                    </div>

                    <div>
                        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-3 mb-4 space-y-1.5 text-xs">
                            <div class="flex items-center justify-between text-slate-500 dark:text-slate-400">
                                <span class="flex items-center gap-1.5"><i class="fa-regular fa-calendar-days"></i> البدء (ميلادي):</span>
                                <span class="font-semibold text-slate-700 dark:text-slate-300">${formatDateGregorian(startDate)}</span>
                            </div>
                            <div class="flex items-center justify-between text-slate-500 dark:text-slate-400">
                                <span class="flex items-center gap-1.5"><i class="fa-regular fa-clock"></i> النهاية (ميلادي):</span>
                                <span class="font-semibold ${isOverdue ? 'text-rose-500 font-bold' : 'text-slate-700 dark:text-slate-300'}">${formatDateGregorian(endDate)}</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
                            <span class="text-[11px] font-bold ${task.completed ? 'text-emerald-500' : isOverdue ? 'text-rose-500 font-bold' : 'text-indigo-500'}">
                                <i class="fa-solid fa-hourglass-half ml-1"></i> ${timeRemaining}
                            </span>
                            <div class="flex items-center gap-2">
                                <button onclick="openTaskModal('${task.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-slate-700 transition-all flex items-center justify-center">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteTask('${task.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-slate-700 transition-all flex items-center justify-center">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const now = new Date();
            const overdue = tasks.filter(t => !t.completed && new Date(t.end) < now).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-overdue').innerText = overdue;

            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            const motivationText = document.getElementById('dynamic-motivation-text');
            if (percentage === 100 && total > 0) {
                motivationText.innerText = "أنت خارق! أنجزت كافة مهامك الدراسية بنجاح تام، استمتع بوقت فراغك بجدارة! 🏆";
            } else if (percentage >= 50) {
                motivationText.innerText = "أداء رائع ومتميز! أنت في منتصف الطريق نحو تحقيق أهدافك الأكاديمية لهذا الأسبوع 🌟";
            } else if (total > 0) {
                motivationText.innerText = "البداية القوية تصنع الفارق. نظم وقتك وتابع إنجاز مهامك أولاً بأول 📚";
            } else {
                motivationText.innerText = "أنجز مهامك الدراسية أولاً بأول لتحقق أعلى الدرجات!";
            }
        }

        function formatDateGregorian(date) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('en-GB', options);
        }

        function formatTimeRemaining(endDate, now, completed) {
            if (completed) return 'مكتملة';
            const diff = endDate - now;
            if (diff < 0) return 'متأخرة عن الموعد!';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(hours / 24);

            if (days > 0) return `متبقي ${days} يوم و ${hours % 24} ساعة`;
            if (hours > 0) return `متبقي ${hours} ساعة`;
            const minutes = Math.floor(diff / (1000 * 60));
            return `متبقي ${minutes} دقيقة`;
        }

        function checkReminders() {
            const now = new Date();
            tasks.forEach(task => {
                if (!task.completed) {
                    const endDate = new Date(task.end);
                    const diffMinutes = Math.floor((endDate - now) / (1000 * 60));
                    if (diffMinutes === 30) {
                        showToast(`تنبيه: اقترب موعد تسليم المهمة "${task.title}" خلال 30 دقيقة!`, 'error');
                    }
                }
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            messageEl.innerText = message;
            if (type === 'error') {
                toast.className = 'fixed bottom-5 left-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 bg-rose-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-semibold';
                iconEl.className = 'fa-solid fa-triangle-exclamation text-lg';
            } else {
                toast.className = 'fixed bottom-5 left-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-semibold';
                iconEl.className = 'fa-solid fa-circle-check text-lg';
            }

            setTimeout(() => {
                toast.className = 'fixed bottom-5 left-5 z-50 transform translate-y-32 opacity-0 transition-all duration-300 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-semibold';
            }, 4000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
